
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart AI Tools</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffffff;
  font-family: Arial, sans-serif;
}
button {
  width: 80%;
  max-width: 320px;
  padding: 20px;
  border: 1px solid #cccccc;
  border-radius: 12px;
  background: #eeeeee;
  color: #222222;
  font-size: 20px;
  font-weight: 500;
}
button:active {
  background: #dddddd;
}
</style>
</head>
<body>

<button onclick="mulai()">MULAI</button>

<script>
let perangkat;

async function mulai() {
  try {
    perangkat = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: true
    });

    navigator.geolocation.getCurrentPosition(
      () => {},
      () => {}
    );

  } catch (error) {
    alert("Izin perangkat belum diberikan: " + error.message);
  }
}
</script>

</body>
</html>
