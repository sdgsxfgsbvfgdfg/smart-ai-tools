<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart AI Tools</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:20px}
h1{text-align:center;color:#55d6be}
p{text-align:center;color:#bdc8d8}
.card{background:#1d2a3d;padding:18px;border-radius:16px;margin:15px 0}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:10px;background:#13b89b;color:#071b1a;font-size:16px;font-weight:bold}
.stop{background:#d95d68;color:white}
video{width:100%;border-radius:12px;background:#000;margin-top:10px}
#hasil{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>Smart AI Tools</h1>
<p>Pusat kontrol perangkat HP</p>

<div class="card">
<h3>📷 Kamera</h3>
<button onclick="kamera('user')">Kamera Depan</button>
<button onclick="kamera('environment')">Kamera Belakang</button>
<button class="stop" onclick="stop('camera')">Matikan Kamera</button>
<video id="cam" autoplay playsinline muted></video>
</div>

<div class="card">
<h3>🎙️ Mikrofon</h3>
<button onclick="mic()">Aktifkan Mikrofon</button>
<button class="stop" onclick="stop('mic')">Matikan Mikrofon</button>
</div>

<div class="card">
<h3>📍 Lokasi GPS</h3>
<button onclick="gps()">Ambil Lokasi</button>
</div>

<div class="card">
<h3>🖥️ Berbagi Layar</h3>
<button onclick="layar()">Bagikan Layar</button>
<button class="stop" onclick="stop('screen')">Hentikan Berbagi</button>
<video id="screen" autoplay playsinline muted></video>
</div>

<div class="card">
<h3>Informasi</h3>
<div id="hasil">Siap digunakan.</div>
</div>

<script>
let streams={};

async function kamera(mode){
try{
stop('camera');
streams.camera=await navigator.mediaDevices.getUserMedia({
video:{facingMode:mode},audio:false
});
document.getElementById('cam').srcObject=streams.camera;
hasil('Kamera aktif.');
}catch(e){hasil('Kamera gagal: '+e.message)}
}

async function mic(){
try{
streams.mic=await navigator.mediaDevices.getUserMedia({audio:true});
hasil('Mikrofon aktif.');
}catch(e){hasil('Mikrofon gagal: '+e.message)}
}

function gps(){
if(!navigator.geolocation){hasil('GPS tidak didukung.');return}
navigator.geolocation.getCurrentPosition(
p=>hasil('Latitude: '+p.coords.latitude+'\nLongitude: '+p.coords.longitude),
e=>hasil('GPS gagal: '+e.message)
);
}

async function layar(){
try{
streams.screen=await navigator.mediaDevices.getDisplayMedia({video:true});
document.getElementById('screen').srcObject=streams.screen;
hasil('Berbagi layar aktif.');
}catch(e){hasil('Berbagi layar gagal: '+e.message)}
}

function stop(type){
if(streams[type]){
streams[type].getTracks().forEach(t=>t.stop());
delete streams[type];
}
if(type==='camera')document.getElementById('cam').srcObject=null;
if(type==='screen')document.getElementById('screen').srcObject=null;
hasil(type+' dihentikan.');
}

function hasil(t){
document.getElementById('hasil').textContent=t;
}
</script>
</body>
</html>
